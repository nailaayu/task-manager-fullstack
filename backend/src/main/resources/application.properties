spring.application.name=naila
server.port=8080

# Database Configuration: H2 untuk praktikum/development
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration: minimal 256-bit secret untuk HS256
jwt.secret=naila-task-manager-super-secret-key-minimum-256-bit-for-hs256-praktikum
jwt.expiration=86400000

# JSON date format support
spring.jackson.serialization.write-dates-as-timestamps=false