name: task_manager_app
description: "Task Manager App with Flutter and Spring Boot REST API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1
  provider: ^6.1.5+1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - "assets/images/Task Manager.png"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Task Manager.png"
  min_sdk_android: 21

  web:
    generate: true
    image_path: "assets/images/Task Manager.png"
    background_color: "#2563EB"
    theme_color: "#2563EB"